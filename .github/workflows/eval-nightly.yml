# Full five-dimension evaluation: nightly and on demand. Uses real API calls (~118 calls, ~426k tokens).
# The job passes or fails on the REGRESSION gate against eval/baseline/baseline.json, never on the
# suite's own overall verdict (Dimension 1 is a documented, known failure; see docs/EVALUATION.md).
name: Eval nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-nightly
  cancel-in-progress: false

jobs:
  eval:
    name: Full evaluation + regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mealsight/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: mealsight/backend/uv.lock
      - run: uv sync --frozen
      - name: Build the databases from committed fixtures
        env:
          MISTRAL_API_KEY: ci-placeholder-not-a-secret
          GROQ_API_KEY: ci-placeholder-not-a-secret
          OPENWEATHER_API_KEY: ci-placeholder-not-a-secret
        run: |
          mkdir -p ../data
          uv run python -m mealsight.seed.seed_all --from-snapshot
          uv run env PYTHONPATH=. python ../scripts/reset_demo_pantry.py
      - name: Run all five dimensions
        # Secrets are exposed to this one step only. The suite exits 1 on its own overall FAIL, which is
        # expected today; the gate below decides pass/fail. A missing scorecard still fails the job.
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          set +e
          uv run env PYTHONPATH=. python -m eval
          echo "suite exit code: $? (1 = overall FAIL, informational)"
          ls eval/results/run_*.json >/dev/null 2>&1 || { echo "::error::no scorecard was written"; exit 2; }
      - name: Regression gate against the recorded baseline
        run: |
          card=$(ls -t eval/results/run_*.json | head -1)
          uv run env PYTHONPATH=. python -m eval.compare "$card" --strict-data --summary-file "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-scorecard
          path: mealsight/backend/eval/results/*.json
          if-no-files-found: warn
          retention-days: 90
