[project]
name = "mealsight"
version = "0.1.0"
description = "MealSight backend — multimodal agentic meal recommendation system"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fastmcp>=3.4.7",
]

[project.scripts]
mealsight-seed = "mealsight.seed.seed_all:main"
mealsight-recipe-server = "mealsight.mcp_servers.recipe_engine.__main__:main"
mealsight-pantry-server = "mealsight.mcp_servers.pantry_manager.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mealsight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: makes a real network call to a live provider; skipped by default, run with -m integration",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = true
